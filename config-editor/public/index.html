<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stack-chan Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">🤖</div>
      <div>
        <h1>Stack-chan Control</h1>
        <p>Robot config &amp; live controls</p>
      </div>
    </header>

    <!-- Connection -->
    <div class="card">
      <h2><span class="dot"></span>Connection</h2>
      <div class="grid">
        <div class="full">
          <label for="robotIp">Robot IP Address</label>
          <input type="text" id="robotIp" placeholder="192.168.2.xxx" class="ip-input" autocomplete="off">
        </div>
      </div>
      <div class="btn-row">
        <button id="loadBtn" class="btn-primary">Load from Robot</button>
        <button id="pushBtn" class="btn-primary">Save &amp; Push</button>
        <button id="localBtn" class="btn-secondary">Save Local</button>
      </div>
      <div id="status"></div>
      <div id="error"></div>
    </div>

    <!-- Live Controls -->
    <div class="card">
      <h2><span class="dot"></span>Live Controls</h2>
      <label for="volume">Speaker Volume</label>
      <div class="volume-row">
        <input type="range" id="volume" min="0" max="100" value="70">
        <span class="volume-val" id="volumeVal">70%</span>
      </div>
      <div class="volume-hint">Applies instantly to the connected robot. Also saved as the boot volume.</div>
      <div class="btn-row">
        <button id="volumeBtn" class="btn-primary">Apply Volume</button>
        <button id="toneBtn" class="btn-secondary">Test Tone</button>
      </div>
    </div>

    <!-- Backend -->
    <div class="card">
      <h2><span class="dot"></span>Backend</h2>
      <div class="grid">
        <div class="full">
          <label for="backend">Backend</label>
          <select id="backend">
            <option value="0">OpenClaw</option>
            <option value="1">Hermes</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Agent Profile -->
    <div class="card">
      <h2><span class="dot"></span>Agent Profile</h2>
      <div class="grid">
        <div>
          <label for="oc_agent_id">Agent ID</label>
          <input type="text" id="oc_agent_id" placeholder="your-agent" data-config="openclaw.agent_id">
        </div>
        <div>
          <label for="oc_default_model">Default Model</label>
          <input type="text" id="oc_default_model" placeholder="openclaw/your-agent" data-config="openclaw.default_model">
        </div>
        <div class="full">
          <label for="oc_bot_token">Bot Token</label>
          <input type="password" id="oc_bot_token" placeholder="Telegram bot token" data-config="openclaw.bot_token">
        </div>
      </div>
    </div>

    <!-- OpenClaw -->
    <div class="card" id="openclawSection">
      <h2><span class="dot"></span>OpenClaw</h2>
      <div class="grid">
        <div>
          <label for="oc_host">Host IP</label>
          <input type="text" id="oc_host" placeholder="&lt;your-server-ip&gt;" data-config="openclaw.host">
        </div>
        <div>
          <label for="oc_port">Port</label>
          <input type="number" id="oc_port" placeholder="18789" data-config="openclaw.port">
        </div>
        <div class="full">
          <label for="oc_model">Model</label>
          <input type="text" id="oc_model" placeholder="openclaw/your-agent" data-config="openclaw.model">
        </div>
      </div>
    </div>

    <!-- Hermes -->
    <div class="card" id="hermesSection">
      <h2><span class="dot"></span>Hermes</h2>
      <div class="grid">
        <div>
          <label for="hm_host">Host IP</label>
          <input type="text" id="hm_host" data-config="hermes.host">
        </div>
        <div>
          <label for="hm_port">Port</label>
          <input type="number" id="hm_port" data-config="hermes.port">
        </div>
        <div>
          <label for="hm_model">Model</label>
          <input type="text" id="hm_model" data-config="hermes.model">
        </div>
        <div>
          <label for="hm_agent_id">Agent ID</label>
          <input type="text" id="hm_agent_id" data-config="hermes.agent_id">
        </div>
        <div>
          <label for="hm_default_model">Default Model</label>
          <input type="text" id="hm_default_model" data-config="hermes.default_model">
        </div>
        <div>
          <label for="hm_bot_token">Bot Token</label>
          <input type="password" id="hm_bot_token" data-config="hermes.bot_token">
        </div>
      </div>
    </div>

    <!-- LLM -->
    <div class="card">
      <h2><span class="dot"></span>LLM</h2>
      <div class="grid">
        <div>
          <label for="llm_type">Type</label>
          <select id="llm_type" data-config="llm.type">
            <option value="0">ChatGPT</option>
            <option value="1">ModuleLLM</option>
            <option value="2">ModuleLLM (FnCl)</option>
            <option value="3">Gemini</option>
            <option value="4" selected>OpenClaw</option>
          </select>
        </div>
        <div>
          <label for="llm_model">Model</label>
          <input type="text" id="llm_model" data-config="llm.model">
        </div>
        <div>
          <label for="llm_enableMemory">Enable Memory</label>
          <select id="llm_enableMemory" data-config="llm.enableMemory">
            <option value="false">No</option>
            <option value="true">Yes</option>
          </select>
        </div>
      </div>
    </div>

    <!-- TTS -->
    <div class="card">
      <h2><span class="dot"></span>TTS</h2>
      <div class="grid">
        <div>
          <label for="tts_type">Type</label>
          <select id="tts_type" data-config="tts.type">
            <option value="0">VoiceVox</option>
            <option value="1">ElevenLabs</option>
            <option value="2">OpenAI TTS</option>
            <option value="3">AquesTalk</option>
            <option value="4">ModuleLLM</option>
          </select>
        </div>
        <div>
          <label for="tts_model">Model</label>
          <input type="text" id="tts_model" data-config="tts.model">
        </div>
        <div>
          <label for="tts_voice">Voice</label>
          <input type="text" id="tts_voice" data-config="tts.voice">
        </div>
      </div>
    </div>

    <!-- STT -->
    <div class="card">
      <h2><span class="dot"></span>STT</h2>
      <div class="grid">
        <div>
          <label for="stt_type">Type</label>
          <select id="stt_type" data-config="stt.type">
            <option value="0">Google</option>
            <option value="1" selected>Groq Whisper</option>
            <option value="2">ModuleLLM ASR</option>
            <option value="3">ModuleLLM Whisper</option>
          </select>
        </div>
        <div>
          <label for="stt_model">Model</label>
          <input type="text" id="stt_model" data-config="stt.model">
        </div>
      </div>
    </div>

    <!-- Wakeword -->
    <div class="card">
      <h2><span class="dot"></span>Wakeword</h2>
      <div class="grid">
        <div>
          <label for="ww_type">Type</label>
          <select id="ww_type" data-config="wakeword.type">
            <option value="0">SimpleVox</option>
            <option value="1">ModuleLLM KWS</option>
          </select>
        </div>
        <div>
          <label for="ww_keyword">Keyword</label>
          <input type="text" id="ww_keyword" data-config="wakeword.keyword">
        </div>
      </div>
    </div>

    <!-- Module LLM -->
    <div class="card">
      <h2><span class="dot"></span>Module LLM</h2>
      <div class="grid">
        <div>
          <label for="mod_rxPin">RX Pin</label>
          <input type="number" id="mod_rxPin" placeholder="13" data-config="moduleLLM.rxPin">
        </div>
        <div>
          <label for="mod_txPin">TX Pin</label>
          <input type="number" id="mod_txPin" placeholder="14" data-config="moduleLLM.txPin">
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button id="loadBtn2" class="btn-primary">Load from Robot</button>
      <button id="pushBtn2" class="btn-primary">Save &amp; Push</button>
    </div>

    <footer>Stack-chan Control · ai-server bridge</footer>
  </div>
</body>
</html>
